services:

  linkding:
    image: sissbruecker/linkding:1.45.0
    container_name: linkding
    ports:
      - "9090:9090"

    environment:
      LD_DB_ENGINE: postgres
      LD_DB_DATABASE: linkding
      LD_DB_USER: linkding
      LD_DB_PASSWORD: ${RDS_DB_PASSWORD}
      LD_DB_HOST: YOUR_RDS_ENDPOINT
      LD_DB_PORT: 5432

    volumes:
      - /opt/linkding/data:/etc/linkding/data